<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gradeo — GCSE Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0f1b3d;--bg:#f2f4fa;--card:#fff;--line:#0f1b3d;--blue:#2b50ff;--org:#ff7a1a;--mint:#17c3a0;--muted:#5d6785;--sh:#0f1b3d;--soft:#e8ecff}
body.dark{--ink:#eef1ff;--bg:#0b1020;--card:#141b33;--line:#3a4570;--muted:#9aa5cc;--sh:#2b50ff;--soft:#1d2748}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',Inter,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
h1,h2,h3,.stat,.timer,.logo{font-family:'Bricolage Grotesque','Plus Jakarta Sans',Arial,sans-serif;letter-spacing:-.02em}
h2,h3{margin:0 0 8px}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.app{display:flex;min-height:100vh}
.sidebar{width:250px;background:#0f1b3d;color:#c9d1f5;padding:22px 16px;position:fixed;top:0;bottom:0;left:0;overflow:auto}
.dark .sidebar{background:#070b17;border-right:1px solid #1d2748}
.logo{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;margin:0 6px 30px;color:#fff}
.logo em{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:var(--org);color:#0f1b3d;font-size:20px;transform:rotate(-6deg)}
.logo span{color:var(--org)}
.nav button{width:100%;padding:12px 14px;text-align:left;background:transparent;border-radius:12px;margin-bottom:4px;color:inherit;font-weight:500;transition:background .15s}
.nav button:hover{background:#1c2a58;color:#fff}
.nav button.active{background:var(--blue);color:#fff;font-weight:700}
.nav .ic{display:inline-block;width:30px}
.main{margin-left:250px;width:calc(100% - 250px);padding:32px 36px;max-width:1200px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}
.topbar h2{font-size:30px;margin:0}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px;margin-bottom:20px;box-shadow:4px 4px 0 var(--sh)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:20px}
.grid .card{margin-bottom:0}
.subject{padding:18px;border-radius:18px;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c,var(--blue));cursor:pointer;transition:transform .15s,box-shadow .15s;box-shadow:3px 3px 0 var(--sh)}
.subject:hover{transform:translate(-2px,-3px);box-shadow:6px 7px 0 var(--sh)}
.subject h3{font-size:18px;margin:10px 0 8px}
.ico{display:grid;place-items:center;width:52px;height:52px;border-radius:14px;font-size:26px;background:color-mix(in srgb,var(--c,var(--blue)) 18%,transparent);margin-bottom:6px}
.ico.lg{width:72px;height:72px;font-size:38px;border-radius:20px}
.btn{background:var(--blue);color:#fff;padding:11px 18px;border-radius:12px;font-weight:700;border:2px solid var(--line);box-shadow:3px 3px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--sh)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}
.btn.secondary{background:var(--soft);color:var(--ink)}
.btn.danger{background:#e5484d}
input,textarea,select{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:0}
textarea{resize:vertical}
.hero{position:relative;overflow:hidden;padding:36px;background:var(--blue);color:#fff;border-radius:24px;margin-bottom:22px;border:2px solid var(--line);box-shadow:6px 6px 0 var(--sh)}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:210px;height:210px;border-radius:50%;background:var(--org);border:2px solid #0f1b3d}
.hero h1{position:relative;z-index:1;margin:0 0 10px;font-size:40px;line-height:1.1;max-width:560px}
.hero p{position:relative;z-index:1;max-width:480px;margin:0 0 18px;font-size:17px}
.hero .btn{position:relative;z-index:1;background:#fff;color:#0f1b3d;border-color:#0f1b3d;box-shadow:3px 3px 0 #0f1b3d}
.stat{font-size:36px;font-weight:800}
.stats .card:nth-child(1){background:#ffe9d6;color:#0f1b3d}
.stats .card:nth-child(2){background:#d6f6ee;color:#0f1b3d}
.stats .card:nth-child(3){background:#e0e6ff;color:#0f1b3d}
.stats .card .small{color:#4a5473}
.small{font-size:13px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.quiz-question{font-family:'Bricolage Grotesque',sans-serif;font-size:22px;font-weight:700;margin-bottom:16px}
.option{display:block;width:100%;text-align:left;padding:14px 16px;margin:10px 0;border:2px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font-weight:500;transition:transform .1s}
.option:hover:not(:disabled){background:var(--soft);transform:translateX(4px)}
.option.right{background:#c9f5dc;border-color:#13894a;color:#0c3a21}
.option.wrong{background:#ffd9d9;border-color:#d03a3f;color:#4a1416}
.timer{font-size:76px;font-weight:800;text-align:center;margin:24px;font-variant-numeric:tabular-nums}
.struggle{border-color:var(--org,#ff7a1a)}
.help{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.help:last-child{border:0}
.lnks{display:flex;gap:8px;flex-wrap:wrap}
.lnk{display:inline-block;padding:8px 12px;border-radius:10px;border:2px solid var(--line);background:var(--soft);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none}
.lnk.yt{background:#ff0033;color:#fff}
.bar{height:14px;border-radius:99px;background:var(--soft);border:2px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.pgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 16px}
.chips.sm{margin-bottom:12px}
.chip{padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:14px}
.chip b{opacity:.6;margin-left:4px}
.chip.on{background:var(--blue);color:#fff}
.chip.add{border-style:dashed;background:transparent}
.task{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:2px dashed var(--line)}
.task:last-child{border:0}
.tick{flex-shrink:0;width:30px;height:30px;border-radius:9px;border:2px solid var(--line);background:var(--card);color:#fff;font-weight:800;font-size:18px;line-height:1;display:grid;place-items:center}
.task.done .tick{background:var(--mint)}
.task.done .ttl{text-decoration:line-through;opacity:.55}
.tmain{flex:1;min-width:0}
.ttl{font-weight:700;word-break:break-word}
.tmeta{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.due.over{color:#e5484d;font-weight:700}
.due.soon{color:var(--org);font-weight:700}
.x{flex-shrink:0;width:30px;height:30px;border-radius:9px;background:transparent;color:var(--muted);font-size:16px}
.x:hover{color:#e5484d}
.empty{text-align:center}
.empty .big{font-size:40px}
.badge{display:inline-block;padding:5px 11px;border-radius:999px;background:var(--soft);border:1.5px solid var(--line);margin:3px 3px 3px 0;font-size:13px;font-weight:500}
.award{display:flex;gap:16px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.award:last-child{border:0}
.award.locked{opacity:.4;filter:grayscale(1)}
.award .big{display:grid;place-items:center;width:52px;height:52px;font-size:28px;border-radius:14px;background:#ffe9d6;border:2px solid #0f1b3d}
.field{margin-bottom:16px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.tip{padding:12px 0;border-bottom:2px dashed var(--line)}
.tip:last-child{border:0}
.tip b{display:block}
@media(max-width:850px){
.sidebar{width:70px;padding:14px 8px}
.logo{justify-content:center;margin:0 0 24px}
.logo b{display:none}
.nav button{text-align:center;padding:12px 0}
.nav .t{display:none}
.nav .ic{width:auto;font-size:20px}
.main{margin-left:70px;width:calc(100% - 70px);padding:20px 16px}
.grid{grid-template-columns:1fr}
.hero{padding:26px}
.hero h1{font-size:30px}
.hero::after{width:130px;height:130px;right:-40px;top:-40px}
.timer{font-size:60px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.hidden{display:none!important}
.auth{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;padding:16px;overflow:auto}
.authcard{width:min(420px,100%);margin:0}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border-radius:12px;background:var(--soft);color:var(--ink);font-weight:700;border:2px solid var(--line)}
.tabs button.on{background:var(--blue);color:#fff}
.chk{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:14px;cursor:pointer}
.chk input{width:auto}
.authcard a{color:var(--blue);font-weight:700}
.authcard .btn{margin-top:4px}
.av{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;overflow:hidden;background:var(--org);color:#0f1b3d;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:18px;border:2px solid var(--line);cursor:pointer;flex-shrink:0}
.av img{width:100%;height:100%;object-fit:cover}
.lgav{width:84px;height:84px;font-size:34px;cursor:default}
.toast{display:none;position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:99;background:#0f1b3d;color:#fff;padding:12px 18px;border-radius:12px;border:2px solid #ff7a1a;max-width:90%}
</style>
</head>
<body>

<div id="auth" class="auth hidden"></div>

<div class="app">
<aside class="sidebar">
  <div class="logo"><em>G</em><b>Grade<span>o</span></b></div>
  <div class="nav" id="nav">
    <button data-v="home" onclick="go('home')"><span class="ic">🏠</span><span class="t">Home</span></button>
    <button data-v="subjects" onclick="go('subjects')"><span class="ic">📚</span><span class="t">Subjects</span></button>
    <button data-v="quiz" onclick="go('quiz')"><span class="ic">🧠</span><span class="t">Quiz</span></button>
    <button data-v="advice" onclick="go('advice')"><span class="ic">🎯</span><span class="t">Study Advice</span></button>
    <button data-v="timer" onclick="go('timer')"><span class="ic">⏱️</span><span class="t">Study Timer</span></button>
    <button data-v="methods" onclick="go('methods')"><span class="ic">💡</span><span class="t">Study Methods</span></button>
    <button data-v="planner" onclick="go('planner')"><span class="ic">📅</span><span class="t">Planner</span></button>
    <button data-v="awards" onclick="go('awards')"><span class="ic">🏆</span><span class="t">Awards</span></button>
    <button data-v="settings" onclick="go('settings')"><span class="ic">⚙️</span><span class="t">Settings</span></button>
  </div>
</aside>

<main class="main">
  <div class="topbar">
    <div>
      <div class="small">GCSE Study Dashboard</div>
      <h2 id="pageTitle">Home</h2>
    </div>
    <div class="row"><div class="av" id="avatarTop" onclick="go('settings')" title="Your profile"></div><button class="btn secondary" onclick="toggleTheme()">🌙 Theme</button></div>
  </div>
  <div id="content"></div>
</main>
</div>

<script>
/* ===== HELPERS ===== */
function store(k,d){try{const v=localStorage.getItem(pfx(k));return v===null?d:v}catch(e){return d}}
function save(k,v){try{localStorage.setItem(pfx(k),v)}catch(e){toast("Couldn't save. Your browser storage may be full or blocked.")}}
function toast(t){
  let e=document.getElementById("toast");
  if(!e){e=document.createElement("div");e.id="toast";e.className="toast";document.body.appendChild(e)}
  e.textContent=t;e.style.display="block";
  clearTimeout(e._t);e._t=setTimeout(()=>{e.style.display="none"},4000);
}
window.addEventListener("error",()=>toast("Something went wrong. Try again, or refresh the page."));
window.addEventListener("unhandledrejection",()=>toast("Something went wrong. Try again, or refresh the page."));
function escapeHTML(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;")}

/* ===== ACCOUNTS (saved in this browser) ===== */
let currentUser=null;
let authUser="";
const GLOBAL_KEYS=["gradeo_theme","gradeo_users","gradeo_session"];
const SEC_QUESTIONS=["What was your first pet's name?","What street did you grow up on?","What is your favourite teacher's surname?","What was your first school called?","What is your favourite food?"];
function pfx(k){return(currentUser&&!GLOBAL_KEYS.includes(k))?"gradeo_u_"+currentUser+"_"+k:k}
function getUsers(){try{return JSON.parse(store("gradeo_users","{}"))}catch(e){return{}}}
function setUsers(u){save("gradeo_users",JSON.stringify(u))}
const norm=s=>s.trim().toLowerCase();
async function hash(t){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("");
  }
  let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return "x"+h;
}
function amsg(t,ok){const m=document.getElementById("authMsg");if(m){m.textContent=t;m.style.color=ok?"#13894a":"#d03a3f"}}
function togglePw(){["aP","sP","fP"].forEach(id=>{const e=document.getElementById(id);if(e)e.type=e.type==="password"?"text":"password"})}
const showBox=`<label class="chk"><input type="checkbox" onchange="togglePw()"> Show password</label>`;

function showAuth(mode){
  const a=document.getElementById("auth");
  a.classList.remove("hidden");
  const tab=(m,l)=>`<button class="${mode===m?"on":""}" onclick="showAuth('${m}')">${l}</button>`;
  let body="";
  if(mode==="login"){
    body=`<div class="field"><label for="aU">Username</label><input id="aU" autocomplete="username"></div>
    <div class="field"><label for="aP">Password</label><input id="aP" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></div>
    ${showBox}<label class="chk"><input type="checkbox" id="aRem" checked> Keep me logged in</label>
    <button class="btn" onclick="doLogin()">Log in</button>
    <p class="small"><a href="#" onclick="showAuth('forgot1');return false">Forgot your password?</a></p>`;
  }else if(mode==="signup"){
    body=`<div class="field"><label for="sU">Username</label><input id="sU" autocomplete="username" placeholder="3–20 letters or numbers"></div>
    <div class="field"><label for="sP">Password</label><input id="sP" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div>
    ${showBox}
    <div class="field"><label for="sQ">Security question</label><select id="sQ">${SEC_QUESTIONS.map(q=>`<option>${q}</option>`).join("")}</select></div>
    <div class="field"><label for="sA">Your answer</label><input id="sA" autocomplete="off" onkeydown="if(event.key==='Enter')doSignup()"></div>
    <p class="small">You'll use this question to reset your password. Capital letters don't matter.</p>
    <button class="btn" onclick="doSignup()">Create account</button>`;
  }else if(mode==="forgot1"){
    body=`<h3>Reset your password</h3><div class="field"><label for="fU">Username</label><input id="fU" onkeydown="if(event.key==='Enter')doForgot1()"></div>
    <button class="btn" onclick="doForgot1()">Next</button> <button class="btn secondary" onclick="showAuth('login')">Back</button>`;
  }else if(mode==="forgot2"){
    const u=getUsers()[authUser];
    body=`<h3>Reset your password</h3><p><b>${escapeHTML(u.q)}</b></p>
    <div class="field"><label for="fA">Your answer</label><input id="fA" autocomplete="off"></div>
    <div class="field"><label for="fP">New password</label><input id="fP" type="password" autocomplete="new-password" placeholder="At least 6 characters" onkeydown="if(event.key==='Enter')doForgot2()"></div>
    ${showBox}<button class="btn" onclick="doForgot2()">Save new password</button> <button class="btn secondary" onclick="showAuth('login')">Cancel</button>`;
  }
  a.innerHTML=`<div class="card authcard"><div class="logo" style="color:var(--ink);margin:0 0 16px"><em>G</em><b>Grade<span>o</span></b></div>
  ${mode.startsWith("forgot")?"":`<div class="tabs">${tab("login","Log in")}${tab("signup","Sign up")}</div>`}
  ${body}<div class="small" id="authMsg" style="margin-top:12px;min-height:18px"></div></div>`;
}

async function doSignup(){
  const name=document.getElementById("sU").value.trim();
  const pw=document.getElementById("sP").value;
  const q=document.getElementById("sQ").value;
  const ans=document.getElementById("sA").value;
  const key=norm(name);
  if(!/^[a-z0-9_.-]{3,20}$/.test(key))return amsg("Username must be 3–20 letters or numbers.");
  if(pw.length<6)return amsg("Password must be at least 6 characters.");
  if(!ans.trim())return amsg("Type an answer to your security question.");
  const users=getUsers();
  if(users[key])return amsg("That username is taken. Try another.");
  const salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  users[key]={name:name,salt:salt,pass:await hash(salt+pw),q:q,a:await hash(salt+norm(ans)),avatar:""};
  setUsers(users);
  save("gradeo_session",key);
  login(key);
}
async function doLogin(){
  const key=norm(document.getElementById("aU").value);
  const pw=document.getElementById("aP").value;
  const u=getUsers()[key];
  if(!u||(await hash(u.salt+pw))!==u.pass)return amsg("Wrong username or password.");
  if(document.getElementById("aRem").checked)save("gradeo_session",key);else save("gradeo_session","");
  login(key);
}
function doForgot1(){
  const key=norm(document.getElementById("fU").value);
  if(!getUsers()[key])return amsg("We can't find that username.");
  authUser=key;showAuth("forgot2");
}
async function doForgot2(){
  const users=getUsers();const u=users[authUser];
  const ans=document.getElementById("fA").value;
  const pw=document.getElementById("fP").value;
  if(pw.length<6)return amsg("New password must be at least 6 characters.");
  if((await hash(u.salt+norm(ans)))!==u.a)return amsg("That answer doesn't match.");
  u.pass=await hash(u.salt+pw);
  setUsers(users);
  showAuth("login");
  amsg("Password changed. Log in with your new password.",true);
}
function login(key){
  currentUser=key;
  loadState();
  const authBox=document.getElementById("auth");
  authBox.classList.add("hidden");
  authBox.innerHTML="";
  updateAvatars();
  go("home");
}
function logout(){
  save("gradeo_session","");
  clearInterval(timerInterval);timerRunning=false;timerSeconds=25*60;
  currentUser=null;quiz=null;
  showAuth("login");
}
function me(){return getUsers()[currentUser]||{name:"",avatar:""}}
function avatarInner(){
  const u=me();
  return escapeHTML((u.name||"?").charAt(0).toUpperCase());
}
function updateAvatars(){const t=document.getElementById("avatarTop");if(t)t.innerHTML=avatarInner()}

/* ===== STATE ===== */
let view="home",arg=null,quiz=null;
let state={xp:0,streak:0,lastDay:"",quizzes:0,perfect:0,sessions:0,plan:"",weak:{},tasks:[],secs:[]};
function loadState(){state={
  xp:Number(store("gradeo_xp",0)),streak:Number(store("gradeo_streak",0)),lastDay:store("gradeo_lastday",""),
  quizzes:Number(store("gradeo_quizzes",0)),perfect:Number(store("gradeo_perfect",0)),
  sessions:Number(store("gradeo_sessions",0)),plan:store("gradeo_plan",""),weak:(()=>{try{return JSON.parse(store("gradeo_weak","{}"))||{}}catch(e){return{}}})(),
  tasks:(()=>{try{const v=JSON.parse(store("gradeo_tasks","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})(),
  secs:(()=>{try{const v=JSON.parse(store("gradeo_secs","[]"));return Array.isArray(v)?v:[]}catch(e){return[]}})()
};}
function persist(){
  save("gradeo_xp",state.xp);save("gradeo_streak",state.streak);save("gradeo_lastday",state.lastDay);
  save("gradeo_quizzes",state.quizzes);save("gradeo_perfect",state.perfect);
  save("gradeo_sessions",state.sessions);save("gradeo_plan",state.plan);save("gradeo_weak",JSON.stringify(state.weak||{}));save("gradeo_tasks",JSON.stringify(state.tasks||[]));save("gradeo_secs",JSON.stringify(state.secs||[]));
}
function addXP(n){
  const today=new Date().toDateString();
  if(state.lastDay!==today){
    const y=new Date();y.setDate(y.getDate()-1);
    state.streak=state.lastDay===y.toDateString()?state.streak+1:1;
    state.lastDay=today;
  }
  state.xp+=n;persist();
}
const level=()=>Math.floor(state.xp/100)+1;

/* ===== CONTENT ===== */
const SUBJECTS=[

/* ===== TIMER ===== */
let timerSeconds=25*60,timerRunning=false,timerInterval=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function paintTimer(){const e=document.getElementById("tm");if(e)e.textContent=fmt(timerSeconds);document.title=timerRunning?fmt(timerSeconds)+" · Gradeo":"Gradeo — GCSE Study"}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;render();return}
  timerRunning=true;
  timerInterval=setInterval(()=>{
    timerSeconds--;paintTimer();
    if(timerSeconds<=0){
      clearInterval(timerInterval);timerRunning=false;timerSeconds=25*60;
      state.sessions++;addXP(25);toast("Session complete! +25 XP");
      document.title="Gradeo — GCSE Study";render();
    }
  },1000);
  render();
}
function resetTimer(){clearInterval(timerInterval);timerRunning=false;timerSeconds=25*60;document.title="Gradeo — GCSE Study";render()}

/* ===== QUIZ ===== */
function startQuiz(id){
  const s=SUBJECTS.find(x=>x.id===id);
  quiz={s:s,i:0,score:0,picked:null,missed:[],qs:[...s.qs].sort(()=>Math.random()-.5)};
  go("quiz");
}
function pick(n){
  if(quiz.picked!==null)return;
  quiz.picked=n;
  const q=quiz.qs[quiz.i],ok=n===q.a;
  if(ok)quiz.score++;
  recordTopic(quiz.s.id,q.t,ok);
  if(!ok&&q.t&&!quiz.missed.includes(q.t))quiz.missed.push(q.t);
  render();
}
function nextQ(){
  quiz.i++;quiz.picked=null;
  if(quiz.i>=quiz.qs.length){
    state.quizzes++;
    if(quiz.score===quiz.qs.length)state.perfect++;
    addXP(quiz.score*10);
  }
  render();
}


/* ===== STRUGGLING TOPICS + HELP LINKS ===== */
function recordTopic(sid,t,ok){
  if(!t)return;
  state.weak=state.weak||{};
  const k=sid+"|"+t,r=state.weak[k]||{r:0,w:0};
  if(ok)r.r++;else r.w++;
  state.weak[k]=r;
  persist();
}
function weakTopics(){
  return Object.keys(state.weak||{}).map(k=>{
    const p=k.split("|"),r=state.weak[k],s=SUBJECTS.find(x=>x.id===p[0]);
    return s?{s:s,t:p.slice(1).join("|"),w:r.w,r:r.r}:null;
  }).filter(x=>x&&x.w>x.r).sort((a,b)=>(b.w-b.r)-(a.w-a.r));
}
function helpLinks(subject,topic){
  const q=encodeURIComponent("GCSE "+subject+" "+topic);
  return `<a class="lnk yt" href="https://www.youtube.com/results?search_query=${q}%20explained" target="_blank" rel="noopener noreferrer">▶ YouTube</a><a class="lnk gg" href="https://www.google.com/search?q=${q}%20revision" target="_blank" rel="noopener noreferrer">🔎 Google</a>`;
}
function helpRow(subject,topic,note){
  return `<div class="help"><div><b>${escapeHTML(topic)}</b><div class="small">${escapeHTML(subject)}${note?" · "+note:""}</div></div><div class="lnks">${helpLinks(subject,topic)}</div></div>`;
}
function struggleCard(items,title,intro){
  return `<div class="card struggle"><h3>${title}</h3><p class="small">${intro}</p>${items.join("")}</div>`;
}


/* ===== PLANNER ===== */
const PRESET_SECS=[
 {id:"homework",name:"Homework",icon:"📝"},
 {id:"revision",name:"Revision",icon:"📖"},
 {id:"tests",name:"Tests & exams",icon:"🎯"},
 {id:"projects",name:"Projects",icon:"🧩"},
 {id:"reading",name:"Reading",icon:"📚"}
];
const PRI={high:["🔴","High"],med:["🟡","Medium"],low:["🟢","Low"]};
let pl={sec:"all",filter:"todo",newSec:false};
function allSecs(){return PRESET_SECS.concat(state.secs||[])}
function secOf(id){return allSecs().find(x=>x.id===id)||PRESET_SECS[0]}
function isCustom(id){return(state.secs||[]).some(x=>x.id===id)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysUntil(due){
  if(!due)return null;
  const p=due.split("-").map(Number);if(p.length!==3||p.some(isNaN))return null;
  const a=new Date(p[0],p[1]-1,p[2]),n=new Date();n.setHours(0,0,0,0);
  return Math.round((a-n)/864e5);
}
function dueLabel(t){
  const d=daysUntil(t.due);if(d===null)return"";
  if(t.done)return"📅 "+t.due;
  if(d<0)return"⚠️ Overdue by "+(-d)+(d===-1?" day":" days");
  if(d===0)return"🔥 Due today";
  if(d===1)return"⏰ Due tomorrow";
  if(d<=7)return"📅 Due in "+d+" days";
  return"📅 "+t.due;
}
function dueClass(t){const d=daysUntil(t.due);if(t.done||d===null)return"";return d<0?"over":d<=1?"soon":""}
function sortTasks(a,b){
  if(a.done!==b.done)return a.done?1:-1;
  const da=a.due||"9999",db=b.due||"9999";
  if(da!==db)return da<db?-1:1;
  const o={high:0,med:1,low:2};return(o[a.pri]||1)-(o[b.pri]||1);
}
function addTask(){
  const ti=document.getElementById("tkT"),title=ti.value.trim();
  if(!title){toast("Type what you need to do first.");ti.focus();return}
  state.tasks.push({id:uid(),title:title.slice(0,120),sec:document.getElementById("tkS").value,
    subject:document.getElementById("tkSub").value,due:document.getElementById("tkD").value,
    pri:document.getElementById("tkP").value,done:false,xp:false});
  persist();toast("Task added.");render();
  const n=document.getElementById("tkT");if(n)n.focus();
}
function toggleTask(id){
  const t=state.tasks.find(x=>x.id===id);if(!t)return;
  t.done=!t.done;
  if(t.done&&!t.xp){t.xp=true;addXP(5);toast("Nice one! +5 XP");}
  persist();render();
}
function delTask(id){state.tasks=state.tasks.filter(x=>x.id!==id);persist();render()}
function clearDone(){
  const n=state.tasks.filter(t=>t.done&&(pl.sec==="all"||t.sec===pl.sec)).length;
  if(!n)return toast("No finished tasks to clear.");
  if(!confirm("Remove "+n+" finished task"+(n===1?"":"s")+"?"))return;
  state.tasks=state.tasks.filter(t=>!(t.done&&(pl.sec==="all"||t.sec===pl.sec)));persist();render();
}
function addSection(){
  const n=document.getElementById("scN").value.trim(),i=document.getElementById("scI").value.trim();
  if(!n){toast("Give your section a name.");return}
  if(allSecs().some(x=>x.name.toLowerCase()===n.toLowerCase()))return toast("You already have a section called that.");
  const sec={id:"c_"+uid(),name:n.slice(0,24),icon:(i||"⭐").slice(0,4)};
  state.secs.push(sec);persist();pl.sec=sec.id;pl.newSec=false;render();
}
function delSection(id){
  const n=state.tasks.filter(t=>t.sec===id).length;
  if(!confirm("Delete this section"+(n?" and its "+n+" task"+(n===1?"":"s"):"")+"?"))return;
  state.secs=state.secs.filter(x=>x.id!==id);
  state.tasks=state.tasks.filter(t=>t.sec!==id);
  pl.sec="all";persist();render();
}
function taskRow(t){
  const sec=secOf(t.sec),sub=SUBJECTS.find(x=>x.id===t.subject);
  return `<div class="task ${t.done?"done":""}"><button class="tick" aria-label="${t.done?"Mark as not done":"Mark as done"}" onclick="toggleTask('${t.id}')">${t.done?"✓":""}</button>
  <div class="tmain"><div class="ttl">${escapeHTML(t.title)}</div>
  <div class="tmeta"><span>${sec.icon} ${escapeHTML(sec.name)}</span>${sub?`<span>${sub.icon} ${sub.name}</span>`:""}<span>${PRI[t.pri]?PRI[t.pri][0]:""}</span>${t.due?`<span class="due ${dueClass(t)}">${dueLabel(t)}</span>`:""}</div></div>
  <button class="x" aria-label="Delete task" onclick="delTask('${t.id}')">✕</button></div>`;
}
function plannerHTML(){
  const secs=allSecs(),tasks=state.tasks;
  const total=tasks.length,done=tasks.filter(t=>t.done).length,pct=total?Math.round(done/total*100):0;
  const over=tasks.filter(t=>!t.done&&daysUntil(t.due)!==null&&daysUntil(t.due)<0).length;
  const today=tasks.filter(t=>!t.done&&daysUntil(t.due)===0).length;
  let h=`<div class="card"><h3>Your progress</h3>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <p class="small" style="margin:8px 0 0"><b>${done}</b> of <b>${total}</b> tasks done${total?" · "+pct+"%":""}${over?` · <span class="due over">${over} overdue</span>`:""}${today?` · <span class="due soon">${today} due today</span>`:""}</p></div>`;
  h+=`<div class="card"><h3>Add a task</h3>
   <div class="field"><label for="tkT">What do you need to do?</label><input id="tkT" maxlength="120" placeholder="e.g. Finish algebra worksheet" onkeydown="if(event.key==='Enter')addTask()"></div>
   <div class="pgrid">
    <div class="field"><label for="tkS">Section</label><select id="tkS">${secs.map(x=>`<option value="${x.id}" ${x.id===(pl.sec!=="all"&&pl.sec!=="notes"?pl.sec:"homework")?"selected":""}>${x.icon} ${escapeHTML(x.name)}</option>`).join("")}</select></div>
    <div class="field"><label for="tkSub">Subject</label><select id="tkSub"><option value="">None</option>${SUBJECTS.map(x=>`<option value="${x.id}">${x.icon} ${x.name}</option>`).join("")}</select></div>
    <div class="field"><label for="tkD">Due date</label><input id="tkD" type="date" min="2000-01-01"></div>
    <div class="field"><label for="tkP">Priority</label><select id="tkP"><option value="high">🔴 High</option><option value="med" selected>🟡 Medium</option><option value="low">🟢 Low</option></select></div>
   </div>
   <div class="row"><button class="btn" onclick="addTask()">Add task</button><button class="btn secondary" onclick="document.getElementById('tkD').value='${ymd(new Date())}'">Due today</button><button class="btn secondary" onclick="(function(){const d=new Date();d.setDate(d.getDate()+1);document.getElementById('tkD').value=ymd(d)})()">Due tomorrow</button></div></div>`;
  const cnt=id=>tasks.filter(t=>!t.done&&(id==="all"||t.sec===id)).length;
  h+=`<div class="chips" role="tablist">
   <button class="chip ${pl.sec==="all"?"on":""}" onclick="pl.sec='all';render()">All <b>${cnt("all")}</b></button>
   ${secs.map(x=>`<button class="chip ${pl.sec===x.id?"on":""}" onclick="pl.sec='${x.id}';render()">${x.icon} ${escapeHTML(x.name)} <b>${cnt(x.id)}</b></button>`).join("")}
   <button class="chip ${pl.sec==="notes"?"on":""}" onclick="pl.sec='notes';render()">🗒️ Weekly notes</button>
   <button class="chip add" onclick="pl.newSec=!pl.newSec;render()">＋ New section</button></div>`;
  if(pl.newSec)h+=`<div class="card"><h3>Make your own section</h3><div class="pgrid"><div class="field"><label for="scI">Emoji</label><input id="scI" maxlength="4" placeholder="⭐"></div><div class="field" style="grid-column:span 2"><label for="scN">Name</label><input id="scN" maxlength="24" placeholder="e.g. Clubs, Coursework, Chores" onkeydown="if(event.key==='Enter')addSection()"></div></div><div class="row"><button class="btn" onclick="addSection()">Create section</button><button class="btn secondary" onclick="pl.newSec=false;render()">Cancel</button></div></div>`;
  if(pl.sec==="notes"){
    h+=`<div class="card"><h3>Weekly notes</h3><p class="small">Write what you'll revise each day. It saves as you type.</p><textarea id="plan" rows="12" placeholder="Mon: Maths algebra (45 min)&#10;Tue: Biology cells (30 min)&#10;…" oninput="state.plan=this.value;save('gradeo_plan',this.value)">${escapeHTML(state.plan)}</textarea></div>`;
    return h;
  }
  const f=pl.filter;
  h+=`<div class="chips sm"><button class="chip ${f==="todo"?"on":""}" onclick="pl.filter='todo';render()">To do</button><button class="chip ${f==="done"?"on":""}" onclick="pl.filter='done';render()">Done</button><button class="chip ${f==="all"?"on":""}" onclick="pl.filter='all';render()">Everything</button></div>`;
  const show=sec=>tasks.filter(t=>(sec==="all"||t.sec===sec)&&(f==="all"||(f==="done")===t.done)).sort(sortTasks);
  if(pl.sec==="all"){
    let any=false;
    secs.forEach(x=>{const l=show(x.id);if(!l.length)return;any=true;h+=`<div class="card"><h3>${x.icon} ${escapeHTML(x.name)}</h3>${l.map(taskRow).join("")}</div>`});
    if(!any)h+=`<div class="card empty"><div class="big">${f==="done"?"🎯":"🎉"}</div><p>${f==="done"?"Nothing finished yet. You've got this!":total?"Nothing left to do here. Great work!":"No tasks yet. Add your first one above."}</p></div>`;
  }else{
    const x=secOf(pl.sec),l=show(pl.sec);
    h+=`<div class="card"><h3>${x.icon} ${escapeHTML(x.name)}</h3>${l.length?l.map(taskRow).join(""):`<p class="small">Nothing here yet. Add a task above and pick this section.</p>`}</div>`;
    if(isCustom(pl.sec))h+=`<button class="btn danger" onclick="delSection('${pl.sec}')">Delete this section</button> `;
  }
  if(tasks.some(t=>t.done))h+=`<button class="btn secondary" onclick="clearDone()">Clear finished tasks</button>`;
  return h;
}

const TITLES={home:"Home",subjects:"Subjects",subject:"Subject",quiz:"Quiz",advice:"Study Advice",timer:"Study Timer",methods:"Study Methods",planner:"Planner",awards:"Awards",settings:"Settings"};
function go(v,a){view=v;arg=a||null;render()}
function subjectCard(s){return `<div class="subject" style="--c:${s.c}" tabindex="0" role="button" onclick="go('subject','${s.id}')" onkeydown="if(event.key==='Enter')go('subject','${s.id}')"><div class="ico">${s.icon}</div><h3>${s.name}</h3><div class="small">${s.topics.length} topics · ${s.qs.length} quiz questions</div></div>`}

function render(){
  document.getElementById("pageTitle").textContent=TITLES[view]||"Home";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===(view==="subject"?"subjects":view)));
  const c=document.getElementById("content");let h="";
  if(view==="home"){
    const tip=ADVICE[new Date().getDate()%ADVICE.length];
    h=`<div class="hero"><h1>Hi ${escapeHTML(me().name)}, ready to revise?</h1><p>Pick a subject, take a quiz or start a focus session to earn XP.</p><button class="btn" onclick="go('quiz')">Take a quiz</button></div>
    <div class="grid stats"><div class="card"><div class="stat">${state.xp}</div><div class="small">XP · Level ${level()}</div></div><div class="card"><div class="stat">${state.streak}</div><div class="small">Day streak</div></div><div class="card"><div class="stat">${state.sessions}</div><div class="small">Study sessions</div></div></div>
    <div class="card"><h3>Today's study advice</h3><b>${tip[0]}</b><p>${tip[1]}</p><button class="btn secondary" onclick="go('advice')">More advice</button></div>`;
    const up=state.tasks.filter(t=>!t.done&&t.due).sort(sortTasks).slice(0,3);
    if(up.length)h+=`<div class="card"><h3>Coming up</h3>${up.map(taskRow).join("")}<button class="btn secondary" style="margin-top:12px" onclick="go('planner')">Open planner</button></div>`;
    const wk=weakTopics().slice(0,4);
    if(wk.length)h+=struggleCard(wk.map(x=>helpRow(x.s.name,x.t,x.w+" missed")),"Topics you're struggling with","Based on your quiz answers. Tap a link to get help.");
  }else if(view==="subjects"){
    h=`<div class="grid">${SUBJECTS.map(subjectCard).join("")}</div>`;
  }else if(view==="subject"){
    const s=SUBJECTS.find(x=>x.id===arg)||SUBJECTS[0];
    h=`<div class="card" style="--c:${s.c}"><div class="ico lg">${s.icon}</div><h2>${s.name}</h2>
    <p class="small">Topics to cover</p><div>${s.topics.map(t=>`<span class="badge">${t}</span>`).join("")}</div>
    <h3 style="margin-top:18px">Advice for ${s.name}</h3>${s.advice.map(t=>`<div class="tip">${t}</div>`).join("")}
    <div class="row" style="margin-top:16px"><button class="btn" onclick="startQuiz('${s.id}')">Quiz me</button><button class="btn secondary" onclick="go('subjects')">Back</button></div></div>`;
  }else if(view==="quiz"){
    if(!quiz){h=`<p>Choose a subject to start a quiz. Each correct answer earns 10 XP.</p><div class="grid">${SUBJECTS.map(s=>`<div class="subject" style="--c:${s.c}" tabindex="0" role="button" onclick="startQuiz('${s.id}')" onkeydown="if(event.key==='Enter')startQuiz('${s.id}')"><div class="ico">${s.icon}</div><h3>${s.name}</h3></div>`).join("")}</div>`}
    else if(quiz.i>=quiz.qs.length){
      h=`<div class="card"><h2>${quiz.score===quiz.qs.length?"Perfect score! 🎉":"Quiz finished"}</h2><p class="stat">${quiz.score} / ${quiz.qs.length}</p><p>You earned ${quiz.score*10} XP.</p><div class="row"><button class="btn" onclick="startQuiz('${quiz.s.id}')">Try again</button><button class="btn secondary" onclick="quiz=null;go('quiz')">Other subjects</button></div></div>`
      +(quiz.missed.length?struggleCard(quiz.missed.map(t=>helpRow(quiz.s.name,t)),"You're struggling with these topics","Watch a video or read up on each one, then try the quiz again."):"");
    }else{
      const q=quiz.qs[quiz.i];
      h=`<div class="card"><div class="small">${quiz.s.name} · Question ${quiz.i+1} of ${quiz.qs.length}</div><div class="quiz-question">${escapeHTML(q.q)}</div>
      ${q.o.map((o,n)=>`<button class="option ${quiz.picked===null?"":n===q.a?"right":n===quiz.picked?"wrong":""}" ${quiz.picked!==null?"disabled":""} onclick="pick(${n})">${escapeHTML(o)}</button>`).join("")}
      ${quiz.picked!==null?`<button class="btn" onclick="nextQ()">${quiz.i+1<quiz.qs.length?"Next question":"See results"}</button>`:""}</div>`;
    }
  }else if(view==="advice"){
    h=`<div class="card"><h3>Study advice</h3>${ADVICE.map(a=>`<div class="tip"><b>${a[0]}</b>${a[1]}</div>`).join("")}</div>
    <h3>Advice by subject</h3><div class="grid">${SUBJECTS.map(s=>`<div class="card" style="--c:${s.c};border-top:8px solid ${s.c}"><div class="ico">${s.icon}</div><h3>${s.name}</h3>${s.advice.map(t=>`<div class="tip">${t}</div>`).join("")}</div>`).join("")}</div>`;
  }else if(view==="timer"){
    h=`<div class="card"><div class="timer" id="tm">${fmt(timerSeconds)}</div><div class="row" style="justify-content:center"><button class="btn" onclick="toggleTimer()">${timerRunning?"Pause":"Start"}</button><button class="btn secondary" onclick="resetTimer()">Reset</button></div><p class="small" style="text-align:center;margin-top:14px">Finish a full 25-minute session to earn 25 XP. Keep this tab open.</p></div>`;
  }else if(view==="methods"){
    h=`<div class="grid">${METHODS.map(m=>`<div class="card"><div class="ico">${m[0]}</div><h3>${m[1]}</h3><p>${m[2]}</p></div>`).join("")}</div>`;
  }else if(view==="planner"){
    h=plannerHTML();
  }else if(view==="awards"){
    h=`<div class="card"><h3>Awards</h3>${AWARDS.map(a=>`<div class="award ${a[3](state)?"":"locked"}"><div class="big">${a[0]}</div><div><b>${a[1]}</b><div class="small">${a[2]}</div></div></div>`).join("")}</div>`;
  }else if(view==="settings"){
    h=`<div class="card"><h3>Account</h3><p>Logged in as <b>${escapeHTML(me().name)}</b></p><button class="btn danger" onclick="logout()">Log out</button></div>`;
  }
  c.innerHTML=h;
  window.scrollTo(0,0);
}

/* ===== THEME + START ===== */
function toggleTheme(){
  document.body.classList.toggle("dark");
  save("gradeo_theme",document.body.classList.contains("dark")?"dark":"light");
}
(function init(){
  if(store("gradeo_theme","light")==="dark")document.body.classList.add("dark");
  const key=store("gradeo_session","");
  if(key&&getUsers()[key])login(key);else showAuth("login");
})();
</script>
</body>
</html>
